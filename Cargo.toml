[package]
name = "shuffle"
version = "0.2.8"
edition = "2021"
description = "Shuffle — a fast, snappy file manager for Apple Silicon Macs"
publish = false

[dependencies]
gpui = "0.2.2"
chrono = "0.4"
# Defer native panels until the current GPUI event has released its app borrow.
dispatch2 = "0.3"
# Parallel fuzzy scoring of the in-memory file index.
rayon = "1"
# Fast parallel directory walking for index builds.
jwalk = "0.8"
# Decode the TIFF that NSImage hands us for file-type icons.
image = { version = "0.25", features = ["tiff"] }
# Fetch real macOS file icons via NSWorkspace (Apple Silicon / AppKit).
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFError", "CFString", "CFURL"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["std", "SharedFileList", "LSSharedFileList"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSError", "NSFileManager", "NSURL", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext", "NSResponder", "NSView", "NSEvent", "NSApplication", "NSPasteboard", "NSDragging", "NSDraggingItem", "NSDraggingSession"] }
# Native macOS Quick Look panel shown with Space.
quicklook = "0.2"
# Reach the underlying NSView so we can start native OS drag sessions (drag files out to Finder/other apps).
raw-window-handle = "0.6"

# Apple Silicon only for now. Build with a thin release profile while
# we iterate; we can tune this later.
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
